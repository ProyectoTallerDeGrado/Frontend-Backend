# Producción en una instancia EC2: Caddy (HTTPS) + web + API + PostgreSQL + tareas.
# Vive en /opt/emprendeu de la instancia junto a `.env` (copia de `.env.example`).
# Las imágenes las construye GitHub Actions (.github/workflows/deploy.yml) y las
# publica en GHCR; aquí solo se descargan. Guía: doc/despliegue-aws.md.

x-api: &api
  image: ${API_IMAGE:?define API_IMAGE}:${IMAGE_TAG:-latest}
  env_file: .env
  environment: &api-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CORS_ORIGINS: '["https://${WEB_DOMAIN}"]'
    # Caddy y la web llegan desde la red interna: se cree su X-Forwarded-For.
    TRUSTED_PROXIES: '["172.30.0.0/24"]'
    OLLAMA_BASE_URL: http://ollama:11434
    WEB_URL: https://${WEB_DOMAIN}
    UPLOAD_DIR: /app/uploads
    FCM_CREDENTIALS_FILE: ${FCM_CREDENTIALS_FILE:-}
  volumes:
    - ./secrets:/run/secrets/emprendeu:ro
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?define WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?define API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?define ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB}
    # Sin puertos publicados: solo la red interna llega a la base.
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Datos de demostración (database/SEED.md): solo con SEED_DEMO_DATA=true, una base sin
  # usuarios y ENVIRONMENT distinto de production.
  seed:
    <<: *api
    restart: "no"
    command:
      - sh
      - -c
      - if [ "$$SEED_DEMO_DATA" = "true" ]; then python -m emprendeu.db.seed; fi
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *api
    volumes:
      - ./secrets:/run/secrets/emprendeu:ro
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:?define WEB_IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # La web habla con la API por la red interna (no sale a internet).
      API_URL: http://api:8000/api/v1
      SITE_URL: https://${WEB_DOMAIN}
    depends_on: [api]

  # Embeddings de la base de conocimiento (subir documentos del coach). Solo el modelo
  # de embeddings: el Coach IA corre en el celular, no en el servidor.
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.12.6
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]

  alerts-job:
    <<: *api
    # La imagen trae el healthcheck HTTP de la API; una tarea no escucha en ningún puerto.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - while true; do python -m emprendeu.modules.alerts.jobs; sleep ${ALERTS_INTERVAL_SECONDS:-86400}; done

  reminders-job:
    <<: *api
    # La imagen trae el healthcheck HTTP de la API; una tarea no escucha en ningún puerto.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - while true; do python -m emprendeu.modules.mentoring.jobs; sleep ${REMINDERS_INTERVAL_SECONDS:-3600}; done

  wellbeing-report:
    <<: *api
    # La imagen trae el healthcheck HTTP de la API; una tarea no escucha en ningún puerto.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - while true; do sleep ${WELLBEING_REPORT_INTERVAL_SECONDS:-604800}; python -m emprendeu.modules.ai_assistant.jobs; done

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  dbdata:
  uploads:
  ollama:
  caddy_data:
  caddy_config:
