name: backend

on:
  push:
    paths: ["Backend/EmprendeU/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["Backend/EmprendeU/**", ".github/workflows/backend.yml"]

# Credenciales de la base y secreto JWT SOLO para este CI (base efimera). Si defines los
# secretos CI_DB_PASSWORD y CI_JWT_SECRET en GitHub se usan en su lugar; los valores de
# respaldo son desechables y no sirven para nada fuera de este contenedor.
env:
  PG_USER: emprendeu
  PG_DB: emprendeu
  PG_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci-solo-pruebas-db' }}
  JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-secret-solo-para-pruebas-0123456789abcdef' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/EmprendeU
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ${{ env.PG_USER }}"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Esquema al dia con los modelos
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t emprendeu-api Backend/EmprendeU
