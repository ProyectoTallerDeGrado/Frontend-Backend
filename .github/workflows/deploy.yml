name: deploy

# Despliegue continuo a la instancia EC2: en cada push a main (o a mano) corre las
# pruebas de backend y web, publica las imágenes en GHCR y actualiza la instancia por SSH.
# Configuración (Settings → Secrets and variables → Actions), guía en doc/despliegue-aws.md:
#   secrets:   EC2_HOST (IP elástica), EC2_USER (ubuntu), EC2_SSH_KEY (clave privada .pem)
#   variables: WEB_DOMAIN, API_DOMAIN (p. ej. emprendeu.3.4.5.6.sslip.io / api.3.4.5.6.sslip.io)
on:
  push:
    branches: [main]
    paths:
      - "Backend/EmprendeU/**"
      - "Frontend/emprendeu/**"
      - "deploy/aws-ec2/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un despliegue a la vez; uno nuevo espera al anterior en vez de cortarlo a medias.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend:
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  web:
    uses: ./.github/workflows/web.yml

  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: Backend/EmprendeU
          - name: web
            context: Frontend/emprendeu
    steps:
      - uses: actions/checkout@v4
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/emprendeu-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SITE_URL=https://${{ vars.WEB_DOMAIN }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.WEB_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - name: Clave SSH de la instancia
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Copiar compose, Caddyfile y scripts
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
        run: |
          scp -i ~/.ssh/ec2.pem deploy/aws-ec2/docker-compose.yml deploy/aws-ec2/Caddyfile \
            deploy/aws-ec2/deploy.sh deploy/aws-ec2/.env.example "$TARGET":/opt/emprendeu/
      - name: Desplegar
        env:
          TARGET: ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # El token de GitHub vence al terminar el job: solo sirve para esta descarga.
          # Va por la entrada estándar, no en la línea de comandos de la instancia.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2.pem "$TARGET" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/ec2.pem "$TARGET" "
            set -e
            trap 'docker logout ghcr.io >/dev/null' EXIT
            chmod +x /opt/emprendeu/deploy.sh
            IMAGE_TAG='$IMAGE_TAG' /opt/emprendeu/deploy.sh
          "
      - name: Comprobar desde internet
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS "https://${{ vars.API_DOMAIN }}/health" && curl -fsS -o /dev/null "https://${{ vars.WEB_DOMAIN }}/"; then
              echo; echo "Desplegado: https://${{ vars.WEB_DOMAIN }}"; exit 0
            fi
            sleep 6
          done
          echo "La web o la API no responden por HTTPS." >&2
          exit 1
