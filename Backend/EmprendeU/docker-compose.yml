# Entorno completo de desarrollo/demostracion:  docker compose up --build
# La IA local (Ollama) es opcional:             docker compose --profile ai up --build
#
# Toda la configuracion sale del entorno (o del `.env` de esta carpeta); aqui no hay
# credenciales. Copia `.env.example` a `.env` y ajusta los valores. Las variables
# marcadas como obligatorias hacen fallar `docker compose` con un mensaje claro.
#
# El paso `migrate` crea/actualiza el esquema una vez, `seed` carga datos de demostracion
# si la base esta vacia, y la API arranca despues.
# La base usa pgvector (busqueda semantica del asistente) y la misma version 17
# que ya usaba el proyecto, para no invalidar volumenes existentes.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB (ver .env.example)}
    ports:
      # Cambia DB_PORT si el 5432 de tu maquina ya esta ocupado.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # `$$` lo expande el shell del contenedor, no compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu entorno (ver .env.example)}

  # Datos de demostracion: solo si la base no tiene usuarios (una vez). Desactivalo con
  # SEED_DEMO_DATA=false. Cuentas y contenido: database/SEED.md.
  seed:
    build: .
    restart: "no"
    command:
      - sh
      - -c
      - if [ "$$SEED_DEMO_DATA" = "true" ]; then python -m emprendeu.db.seed; fi
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu entorno (ver .env.example)}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Genera el tuyo: python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu entorno (ver .env.example)}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # Lista JSON de origenes permitidos, p. ej. ["http://localhost:3000"]
      CORS_ORIGINS: ${CORS_ORIGINS:?define CORS_ORIGINS (ver .env.example)}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads

  # Deteccion de riesgo de desercion (inactividad, sentimiento, compromisos vencidos):
  # corre una vez al arrancar y luego cada ALERTS_INTERVAL_SECONDS (por defecto 24 h).
  # Sin Docker: cron diario con `uv run python -m emprendeu.modules.alerts.jobs`.
  alerts-job:
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - while true; do python -m emprendeu.modules.alerts.jobs; sleep ${ALERTS_INTERVAL_SECONDS:-86400}; done
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET en tu entorno (ver .env.example)}
      ENVIRONMENT: ${ENVIRONMENT:-development}

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Descarga una vez los modelos que usa la API (el de embeddings DEBE ser de 768
  # dimensiones: nomic-embed-text) y termina. Si cambias OLLAMA_*_MODEL, se baja el nuevo.
  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text} && ollama pull ${OLLAMA_CHAT_MODEL:-llama3.2}

volumes:
  dbdata:
  uploads:
  ollama:
